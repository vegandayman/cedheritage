<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Format Checker</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 2rem auto; 
            max-width: 800px; 
            background: #121212; 
            color: #e0e0e0;
        }
        h1, h2 { color: #ffffff; }
        section { 
            margin-bottom: 2rem; 
            padding: 1.5rem; 
            border: 1px solid #333; 
            border-radius: 8px;
            background: #1e1e1e;
        }
        input[type="text"], input[type="file"] { 
            margin-bottom: 1rem; 
            width: 100%; 
            padding: 0.75rem; 
            box-sizing: border-box;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
        }
        button { 
            padding: 0.75rem 1.5rem; 
            cursor: pointer; 
            background: #007acc; 
            color: white; 
            border: none; 
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover { background: #005f9e; }
        .result-box { 
            margin-top: 1.5rem; 
            padding: 1rem; 
            background: #2a2a2a; 
            border-radius: 4px;
            min-height: 50px; 
            border: 1px solid #444;
        }
        .legal { color: #4caf50; font-weight: bold; }
        .illegal { color: #f44336; font-weight: bold; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        img.card-image { width: 100%; border-radius: 4.75%; }
        .deck-item { margin-bottom: 0.25rem; border-bottom: 1px solid #444; padding-bottom: 0.25rem; }
    </style>
</head>
<body>
    <h1>Heritage Format Tools</h1>

    <section>
        <h2>1. Search Database</h2>
        <input type="text" id="searchInput" placeholder="Enter card name (e.g., Lightning Bolt)">
        <button onclick="searchCard()">Search Heritage</button>
        <div id="searchResults" class="result-box"></div>
    </section>

    <section>
        <h2>2. Decklist Legality Checker</h2>
        <p>Upload a standard text decklist. Quantities and set codes will be stripped automatically. Basic lands are ignored.</p>
        <input type="file" id="deckFile" accept=".txt">
        <button onclick="checkDeck()">Check Legality</button>
        <div id="deckResults" class="result-box"></div>
    </section>

    <script>
        const BASE_QUERY = 'f:commander (in:core OR in:expansion) -is:ub -o:"your commander"';
        const BASIC_LANDS = ['plains', 'island', 'swamp', 'mountain', 'forest', 'snow-covered plains', 'snow-covered island', 'snow-covered swamp', 'snow-covered mountain', 'snow-covered forest'];

        async function searchCard() {
            const input = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');
            if (!input) return;

            resultsDiv.innerHTML = 'Searching...';
            const query = encodeURIComponent(`${BASE_QUERY} "${input}"`);
            
            try {
                const response = await fetch(`https://api.scryfall.com/cards/search?q=${query}`);
                if (!response.ok) throw new Error('No legal cards found matching that search.');
                const data = await response.json();
                
                let html = `<p class="legal">Found ${data.total_cards} legal card(s).</p><div class="gallery">`;
                
                data.data.forEach(card => {
                    // Handle dual-faced cards missing normal image uri on the root object
                    const imgUrl = card.image_uris ? card.image_uris.normal : (card.card_faces ? card.card_faces[0].image_uris.normal : '');
                    if (imgUrl) {
                        html += `<a href="${card.scryfall_uri}" target="_blank"><img src="${imgUrl}" class="card-image" alt="${card.name}"></a>`;
                    }
                });
                html += '</div>';
                
                // If more than 175 results, Scryfall paginates. Note this limitation for broad searches.
                if (data.has_more) {
                    html += `<p><em>Results limited to first page. Be more specific to see other cards.</em></p>`;
                }
                
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<span class="illegal">${error.message}</span>`;
            }
        }

        async function checkDeck() {
            const fileInput = document.getElementById('deckFile');
            const resultsDiv = document.getElementById('deckResults');
            
            if (!fileInput.files[0]) {
                resultsDiv.innerHTML = 'Please select a file first.';
                return;
            }

            resultsDiv.innerHTML = 'Parsing file and verifying via Scryfall...';
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                const cardNames = [];

                lines.forEach(line => {
                    const cleanLine = line.trim();
                    if (!cleanLine || cleanLine.toLowerCase().startsWith('sideboard') || cleanLine.toLowerCase().startsWith('commander')) return;

                    // Regex matches numbers at start (1x or 1), then grabs everything up to a parenthesis or end of line
                    const match = cleanLine.match(/^(\d+x?\s+)?([^\(]+)/);
                    if (match && match[2]) {
                        const name = match[2].trim();
                        if (name && !BASIC_LANDS.includes(name.toLowerCase())) {
                            cardNames.push(name);
                        }
                    }
                });

                if (cardNames.length === 0) {
                    resultsDiv.innerHTML = 'No valid cards found to check (or deck is only basic lands).';
                    return;
                }

                // Batch into groups of 25 to respect Scryfall's URI length limit
                const chunkSize = 25;
                let legalCards = new Set();

                for (let i = 0; i < cardNames.length; i += chunkSize) {
                    const chunk = cardNames.slice(i, i + chunkSize);
                    const exactMatches = chunk.map(name => `exact:"${name.replace(/"/g, '')}"`).join(' OR ');
                    const query = encodeURIComponent(`${BASE_QUERY} (${exactMatches})`);
                    
                    try {
                        // 100ms delay to respect Scryfall's 10 req/sec limit
                        await new Promise(r => setTimeout(r, 100));
                        
                        const response = await fetch(`https://api.scryfall.com/cards/search?q=${query}`);
                        if (response.ok) {
                            const data = await response.json();
                            data.data.forEach(card => legalCards.add(card.name.toLowerCase()));
                        }
                    } catch (error) {
                        // 404 means no cards in this chunk passed the filter. Safe to ignore.
                    }
                }

                resultsDiv.innerHTML = '<h3>Legality Report</h3>';
                let hasIllegals = false;
                
                cardNames.forEach(name => {
                    const lowerName = name.toLowerCase();
                    // Check exact match or split card match (e.g. "Fire" in "Fire // Ice")
                    const isLegal = [...legalCards].some(legalName => {
                        const parts = legalName.split(' // ');
                        return legalName === lowerName || parts.includes(lowerName);
                    });
                    
                    if (isLegal) {
                        resultsDiv.innerHTML += `<div class="deck-item"><span class="legal">✓ LEGAL:</span> ${name}</div>`;
                    } else {
                        hasIllegals = true;
                        resultsDiv.innerHTML += `<div class="deck-item"><span class="illegal">✗ ILLEGAL:</span> ${name}</div>`;
                    }
                });

                if (!hasIllegals) {
                    resultsDiv.innerHTML += '<h4 class="legal" style="margin-top: 1rem;">All non-basic cards are Heritage Legal.</h4>';
                }
            };
            
            reader.readAsText(fileInput.files[0]);
        }
    </script>
</body>
</html>
