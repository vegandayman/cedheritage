name: Update JSON via Script

on:
  schedule:
    # Runs every day at midnight UTC. Adjust as needed.
    - cron: '0 0 * * *'
  # Allows you to trigger it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
    run-script:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
  
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '24'
  
        - name: Install dependencies (if needed)
          run: npm install
  
        - name: Run JavaScript file
          run: node build-db.js # Replace with your actual filename
  
        - name: Commit and push changes
          run: |
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.net'
            git add heritage_cards.json # Replace with the path to your JSON file
            git commit -m "Automated update of JSON file" || echo "No changes to commit"
            git push
