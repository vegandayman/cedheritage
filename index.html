<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Format Tools & Database</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1, h2 { color: #ffffff; }
        .container { max-width: 900px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #0066cc; cursor: pointer; font-weight: bold; }
        button:hover { background: #0052a3; }
        .card-result { border-bottom: 1px solid #333; padding: 10px 0; }
        .legal { color: #4caf50; }
        .illegal { color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Heritage EDH Decklist Checker</h1>
        <p>Paste your decklist below (quantities and basic lands are automatically filtered):</p>
        <textarea id="decklistInput" rows="10" placeholder="1 Sol Ring&#10;1 Llanowar Elves (Alpha)..."></textarea>
        <button onclick="checkDeck()">Check Legality</button>
        
        <h2>Results</h2>
        <div id="resultsOutput"></div>
    </div>

    <script>
        let cardDatabase = { cards: [] };

        async function loadDatabase() {
            try {
                let response = await fetch('heritage_cards.json');
                cardDatabase = await response.json();
            } catch (e) {
                document.getElementById('resultsOutput').innerHTML = '<p class="illegal">Error loading heritage_cards.json cache.</p>';
            }
        }

        loadDatabase();

        function checkDeck() {
            let rawText = document.getElementById('decklistInput').value;
            let lines = rawText.split('\n');
            let outputDiv = document.getElementById('resultsOutput');
            outputDiv.innerHTML = '';

            let basicLands = ['plains', 'island', 'swamp', 'mountain', 'forest', 'wastes', 'snow-covered plains', 'snow-covered island', 'snow-covered swamp', 'snow-covered mountain', 'snow-covered forest'];

            lines.forEach(line => {
                let cleaned = line.replace(/^\d+x?\s*/, '').trim().toLowerCase();
                if (!cleaned || cleaned.startsWith('//')) return;
                
                // Split multi-faced cards at '/' to check front face
                if (cleaned.includes('//')) {
                    cleaned = cleaned.split('//')[0].trim();
                }

                if (basicLands.includes(cleaned)) {
                    outputDiv.innerHTML += `<div class="card-result"><strong>${line}</strong>: <span class="legal">Legal (Basic Land)</span></div>`;
                    return;
                }

                // Match against base cards or flavor names
                let match = cardDatabase.cards.find(c => c.n === cleaned || c.f.includes(cleaned));

                if (match) {
                    outputDiv.innerHTML += `<div class="card-result"><strong>${line}</strong>: <span class="legal">Legal</span> — <a href="${match.u}" target="_blank">Scryfall Link</a></div>`;
                } else {
                    let fallbackUrl = `https://scryfall.com/search?q=${encodeURIComponent(cleaned)}`;
                    outputDiv.innerHTML += `<div class="card-result"><strong>${line}</strong>: <span class="illegal">Illegal / Not Found</span> — <a href="${fallbackUrl}" target="_blank">Search Scryfall</a></div>`;
                }
            });
        }
    </script>
</body>
</html>
