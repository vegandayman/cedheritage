<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Format Checker</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 2rem auto; 
            max-width: 800px; 
            background: #121212; 
            color: #e0e0e0;
        }
        h1, h2 { color: #ffffff; }
        section { 
            margin-bottom: 2rem; 
            padding: 1.5rem; 
            border: 1px solid #333; 
            border-radius: 8px;
            background: #1e1e1e;
        }
        input[type="text"], input[type="file"] { 
            margin-bottom: 1rem; 
            width: 100%; 
            padding: 0.75rem; 
            box-sizing: border-box;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
        }
        button { 
            padding: 0.75rem 1.5rem; 
            cursor: pointer; 
            background: #007acc; 
            color: white; 
            border: none; 
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover { background: #005f9e; }
        .load-btn {
            display: block;
            width: 100%;
            font-size: 1.5rem;
            padding: 1.5rem;
            background: #4caf50;
            margin-bottom: 2rem;
        }
        .load-btn:hover { background: #43a047; }
        .load-btn:disabled { background: #333; color: #888; cursor: not-allowed; }
        .result-box { 
            margin-top: 1.5rem; 
            padding: 1rem; 
            background: #2a2a2a; 
            border-radius: 4px;
            min-height: 50px; 
            border: 1px solid #444;
        }
        .legal { color: #4caf50; font-weight: bold; }
        .illegal { color: #f44336; font-weight: bold; }
        .deck-item { margin-bottom: 0.25rem; border-bottom: 1px solid #444; padding-bottom: 0.25rem; }
        ul { list-style-type: none; padding-left: 0; }
        li { padding: 0.5rem 0; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <h1>Heritage Format Tools</h1>

    <button id="loadDbBtn" class="load-btn" onclick="loadDatabase()">LOAD DATABASE</button>
    <div id="dbStatus" style="margin-bottom: 2rem; text-align: center; font-weight: bold;"></div>

    <section>
        <h2>1. Search Database</h2>
        <input type="text" id="searchInput" placeholder="Enter card name (e.g., Lightning Bolt)">
        <button onclick="searchCard()">Search Heritage</button>
        <div id="searchResults" class="result-box"></div>
    </section>

    <section>
        <h2>2. Decklist Legality Checker</h2>
        <p>Upload a standard text decklist. Quantities and set codes will be stripped automatically. Basic lands are ignored.</p>
        <input type="file" id="deckFile" accept=".txt">
        <button onclick="checkDeck()">Check Legality</button>
        <div id="deckResults" class="result-box"></div>
    </section>

    <script>
        const BASIC_LANDS = ['plains', 'island', 'swamp', 'mountain', 'forest', 'snow-covered plains', 'snow-covered island', 'snow-covered swamp', 'snow-covered mountain', 'snow-covered forest'];
        let heritageDatabase = new Set();
        let isDbLoaded = false;

        async function loadDatabase() {
            const btn = document.getElementById('loadDbBtn');
            const status = document.getElementById('dbStatus');
            
            btn.disabled = true;
            btn.innerText = "LOADING...";
            status.innerHTML = "Fetching local database file...";

            try {
                const response = await fetch('./heritage_cards.json');
                if (!response.ok) throw new Error('Database file not found. Ensure heritage_cards.json is uploaded.');
                
                const data = await response.json();
                heritageDatabase = new Set(data.map(name => name.toLowerCase()));
                isDbLoaded = true;
                
                btn.style.display = 'none';
                status.innerHTML = `<span class="legal">Database Loaded: ${heritageDatabase.size} legal cards ready.</span>`;
            } catch (error) {
                console.error("Failed to load heritage_cards.json:", error);
                status.innerHTML = `<span class="illegal">Error: ${error.message}</span>`;
                btn.disabled = false;
                btn.innerText = "RETRY LOAD DATABASE";
            }
        }

        function searchCard() {
            const resultsDiv = document.getElementById('searchResults');
            if (!isDbLoaded) {
                resultsDiv.innerHTML = '<span class="illegal">You must load the database first.</span>';
                return;
            }

            const input = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!input) return;

            const matches = [...heritageDatabase].filter(name => name.includes(input));

            if (matches.length === 0) {
                resultsDiv.innerHTML = `<span class="illegal">No legal cards found matching "${input}".</span>`;
                return;
            }

            const displayLimit = 50;
            let html = `<p class="legal">Found ${matches.length} legal card(s). ${matches.length > displayLimit ? `Displaying first ${displayLimit}.` : ''}</p><ul>`;
            
            matches.slice(0, displayLimit).forEach(name => {
                const displayName = name.replace(/\b\w/g, l => l.toUpperCase());
                html += `<li>${displayName}</li>`;
            });
            html += '</ul>';
            
            resultsDiv.innerHTML = html;
        }

        function checkDeck() {
            const resultsDiv = document.getElementById('deckResults');
            if (!isDbLoaded) {
                resultsDiv.innerHTML = '<span class="illegal">You must load the database first.</span>';
                return;
            }

            const fileInput = document.getElementById('deckFile');
            if (!fileInput.files[0]) {
                resultsDiv.innerHTML = 'Please select a file first.';
                return;
            }

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                const cardNames = [];

                lines.forEach(line => {
                    const cleanLine = line.trim();
                    if (!cleanLine || cleanLine.toLowerCase().startsWith('sideboard') || cleanLine.toLowerCase().startsWith('commander')) return;

                    const match = cleanLine.match(/^(\d+x?\s+)?([^<\[\(\*]+)/);
                    if (match && match[2]) {
                        const name = match[2].trim();
                        if (name && !BASIC_LANDS.includes(name.toLowerCase())) {
                            cardNames.push(name);
                        }
                    }
                });

                if (cardNames.length === 0) {
                    resultsDiv.innerHTML = 'No valid cards found to check (or deck is only basic lands).';
                    return;
                }

                resultsDiv.innerHTML = '<h3>Legality Report</h3>';
                let hasIllegals = false;
                
                cardNames.forEach(name => {
                    const lowerName = name.toLowerCase();
                    
                    const isLegal = [...heritageDatabase].some(legalName => {
                        const parts = legalName.split(' // ');
                        return legalName === lowerName || parts.includes(lowerName);
                    });
                    
                    if (isLegal) {
                        resultsDiv.innerHTML += `<div class="deck-item"><span class="legal">✓ LEGAL:</span> ${name}</div>`;
                    } else {
                        hasIllegals = true;
                        resultsDiv.innerHTML += `<div class="deck-item"><span class="illegal">✗ ILLEGAL:</span> ${name}</div>`;
                    }
                });

                if (!hasIllegals) {
                    resultsDiv.innerHTML += '<h4 class="legal" style="margin-top: 1rem;">All non-basic cards are Heritage Legal.</h4>';
                }
            };
            
            reader.readAsText(fileInput.files[0]);
        }
    </script>
</body>
</html>
